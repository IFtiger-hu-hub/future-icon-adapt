[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "future-icon-adapt"
version = "0.2.10"
description = "Modular desktop icon theme composer and per-app icon adapter for KDE Plasma 6 (Qt6 / Kirigami)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "IFtiger-hu-hub" },
]
keywords = [
    "kde",
    "plasma",
    "icons",
    "icon-theme",
    "kirigami",
    "pyqt6",
    "linux",
    "desktop",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
    "Topic :: Utilities",
]
# PyQt6 and KDE Kirigami QML modules are expected from your distribution packages
# (or installed into the active environment) to match the system Qt6 / Plasma runtime.
dependencies = []

[project.scripts]
future-icon-adapt = "iconadapt.__main__:main"
iconadapt = "iconadapt.__main__:main"

[project.urls]
Homepage = "https://github.com/IFtiger-hu-hub/future-icon-adapt"
Repository = "https://github.com/IFtiger-hu-hub/future-icon-adapt"
Issues = "https://github.com/IFtiger-hu-hub/future-icon-adapt/issues"

[tool.setuptools.packages.find]
include = ["iconadapt*"]
